<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offerwall competitive status</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--line:#dfe3e8;--ink:#1f1f1f;--ink2:#555;--ink3:#888;--brand:#1f4e79;--chip:#eef2f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Calibri,"Segoe UI",Arial,sans-serif}
header{background:var(--brand);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:600}header a{color:#cfe0f3;font-size:13px;text-decoration:none}header .spacer{flex:1}
.toolbar{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.tabs button{font:inherit;padding:6px 12px;border:0;background:var(--surface);color:var(--ink2);cursor:pointer}.tabs button.on{background:var(--brand);color:#fff}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--chip);font-size:12px;color:var(--ink2)}
select,input[type=search]{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}input[type=search]{min-width:230px}
.btn{font:inherit;padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
#baselineNote{font-size:12px;color:var(--ink2)}
main{padding:14px 22px 40px;max-width:1400px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.kpi .l{font-size:12px;color:var(--ink2)}.kpi .v{font-size:24px;font-weight:600;margin:2px 0}.kpi .d{font-size:12px;color:var(--ink3)}
.panel{display:none}.panel.on{display:block}h2{font-size:16px;margin:8px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f0f3f6;color:var(--ink2);font-weight:600;white-space:nowrap}td.num,th.num{text-align:right;white-space:nowrap}
td.st{text-align:center;white-space:nowrap;cursor:pointer;min-width:120px}td.st .mv{font-size:12px;display:block;margin-top:2px}
tr.sep td{background:#e9edf2;color:var(--ink2);font-weight:600;font-style:italic}
td.genre{background:#fafbfc;color:var(--ink2);white-space:nowrap}
.gname{cursor:pointer;font-weight:600}.gname:hover{text-decoration:underline}.loose{color:var(--ink3);font-size:11px;cursor:help}
.pill{display:inline-block;font-size:10px;padding:0 6px;border-radius:999px;margin-left:5px;vertical-align:middle}.pill.pt{background:#dbe8f7;color:#1f4e79}.pill.fc{background:#e8e8e8;color:#555}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:0 0 8px}.legend i{display:inline-block;width:14px;height:12px;border:1px solid #ccc;vertical-align:-2px;margin-right:4px}
.sub{font-size:12px;color:var(--ink3)}.caveat{font-size:12px;color:var(--ink2);font-style:italic;margin-top:8px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;overflow-x:auto}.hcard h3{margin:0 0 6px;font-size:14px}
.hist td,.hist th{text-align:center;font-size:12px;padding:3px 6px}.hist td.nc{background:#f3f3f3;color:#bbb}.hist td.nf{color:#999}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;max-width:min(1100px,95vw);width:auto}dialog::backdrop{background:rgba(0,0,0,.35)}
.dhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}.dhead h3{margin:0;font-size:15px;flex:1}.dbody{padding:12px 16px;max-height:75vh;overflow:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px}.tag.spend{background:#fbd5d5;color:#8a1c1c}.tag.play{background:#dff1e2;color:#1e5b2a}.tag.unpaid{background:#eee;color:#666}
tr.spend td{background:#fdf3f2}.bar{display:inline-block;height:6px;background:#9fc3e6;vertical-align:middle;margin-right:5px;border-radius:2px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f1f1f;color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;display:none;z-index:20}
.best{background:#d9ead3}
@media print{header,.toolbar,.kpis{display:none}.panel{display:block!important}main{padding:0}}
</style>
</head>
<body>
<header><h1>Offerwall Tracker</h1><span class="chip" id="checkChip"></span><span class="spacer"></span><a href="email.html">Weekly email</a><a href="status.html">Harvest status</a><a href="overview.html">Trends &amp; change log ›</a></header>
<div class="toolbar">
  <div class="tabs" id="tabs"><button data-t="focus" class="on">Focus matrix</button><button data-t="pub">By publisher</button><button data-t="cat">Full catalog</button><button data-t="hist">History search</button></div>
  <label>Change over <select id="win"><option value="1">Last 24 hours</option><option value="7" selected>Last week</option><option value="30">Last month</option><option value="365">Last year</option></select></label>
  <span id="baselineNote"></span>
  <input type="search" id="q" placeholder="Filter by game or publisher">
  <select id="fs"><option value="">Any status</option><option>Added</option><option>Remains</option><option>Removed</option><option>Not Found</option></select>
  <select id="fw"><option value="">Any wall</option></select>
  <button class="btn primary" id="btnEmail">Generate email</button>
</div>
<main>
  <div class="kpis" id="kpis"></div>
  <div class="panel on" id="p-focus"><h2>Direct top competitors</h2><div class="card"><div class="legend" id="legend"></div><table id="focusTbl"></table></div></div>
  <div class="panel" id="p-pub"><h2>Where each publisher stands</h2><div class="card"><table id="pubTbl"></table><div class="caveat" id="pubCaveat"></div></div></div>
  <div class="panel" id="p-cat"><h2>Every game listed today</h2><div class="card"><table id="catTbl"></table></div></div>
  <div class="panel" id="p-hist"><h2>History search</h2><div style="margin-bottom:10px"><input type="search" id="hq" placeholder="Game or publisher (2+ characters)"></div><div id="histOut"></div></div>
</main>
<dialog id="panel"><div class="dhead"><h3 id="panelTitle"></h3><button class="btn" onclick="document.getElementById('panel').close()">Close</button></div><div class="dbody" id="panelBody"></div></dialog>
<dialog id="dlg"><div class="dhead"><h3>Email preview</h3><button class="btn" id="copySubj">Copy subject</button><button class="btn primary" id="copyBody">Copy email body</button><button class="btn" onclick="document.getElementById('dlg').close()">Close</button></div><div class="dbody"><div class="sub" id="subjLine" style="margin-bottom:8px"></div><div id="emailBody"></div></div></dialog>
<div class="toast" id="toast"></div>
<script src="email_core.js"></script>
<script>
'use strict';
let D=null, ECFG={}; const S={win:'7',q:'',fs:'',fw:''};
const esc=EC.esc, fmt=EC.fmt, longDate=EC.longDate; const C=()=>D.colors; const pubName=p=>EC.pubName(D,p);
const O=()=>({win:S.win,q:S.q,fs:S.fs,fw:S.fw});
const chosenDate=()=>EC.chosenDate(D,S.win), baselineDate=(s,c)=>EC.baselineDate(D,s,c), pres=(s,d,k)=>EC.pres(D,s,d,k), cellOf=(s,k)=>EC.cellOf(D,O(),s,k);
const focusTable=f=>EC.focusTable(D,O(),f), pubTable=f=>EC.pubTable(D,O(),f), legendHtml=()=>EC.legendHtml(D), buildEmail=()=>EC.buildEmail(D,{...O(),baseUrl:location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,''),cfg:ECFG,maxFindings:ECFG.max_findings}), emailText=h=>EC.emailText(h);

const put=(sel,prop,val)=>{ const n=document.querySelector(sel); if(n) n[prop]=val; };
function audit(ids){ const missing=ids.filter(i=>!document.getElementById(i)); if(missing.length) throw new Error('audit: missing ids '+missing.join(', ')); }
const toast=m=>{ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2500); };

// ---------- time (spec §3.4): the browser resolves time
// ---------- focus matrix (spec §4.3)
function renderFocus(){ put('#legend','innerHTML',legendHtml()); put('#focusTbl','innerHTML',focusTable(false)); }

// ---------- publishers (spec §4.4)
function renderPub(){ put('#pubTbl','innerHTML',pubTable(false)); if(S.q){ const q=S.q.toLowerCase(); document.querySelectorAll('#pubTbl tbody tr').forEach(tr=>{ if(!tr.classList.contains('sep')) tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none'; }); }
  const today=new Set(); let attributed=0; for(const s of D.sites) for(const gk of Object.keys(D.presence[s][D.latest[s]]||{})) today.add(gk); for(const gk of today) if(D.games[gk]?.publisher) attributed++;
  put('#pubCaveat','textContent',`Publisher attribution covers ${attributed} of the ${today.size} games listed today; the rest are not represented here.`); }

// ---------- full catalog (spec §4.5)
function renderCatalog(){
  const focusKeys=new Set(D.block1.flatMap(b=>b.keys));
  const rows=[]; const seen=new Set();
  for(const s of D.sites) for(const [gk,r] of Object.entries(D.presence[s][D.latest[s]]||{})){ if(seen.has(gk)) continue; seen.add(gk);
    const per={}; let best=0,walls=0; for(const s2 of D.sites){ const rr=D.presence[s2][D.latest[s2]]?.[gk]; if(rr){ per[s2]=rr; walls++; best=Math.max(best,rr[0]); } }
    rows.push({gk,g:D.games[gk],per,best,walls}); }
  rows.sort((a,b)=>b.best-a.best);
  const cell=r=>{ if(!r) return `<td style="text-align:center;color:#bbb">—</td>`; const vs=r[2]; let sub=vs.length>1?`${vs.length} offers`+(Math.abs(vs[0][3]-vs[vs.length-1][3])>=0.01?` · ${fmt(vs[vs.length-1][3])}–${fmt(vs[0][3])}`:''):`${r[1]} milestones`; return `<td style="text-align:center"><b>${fmt(r[0])}</b><br><span class="sub">${sub}</span></td>`; };
  const html=`<thead><tr><th>Game</th><th>Publisher</th><th>Category</th>${D.sites.map(s=>`<th style="text-align:center">${D.site_label[s]}</th>`).join('')}<th class="num">Best $</th><th class="num">Walls</th></tr></thead><tbody>`+
    rows.map(r=>`<tr><td><span class="gname" data-keys="${esc(r.gk)}">${esc(r.g.name)}</span>${r.g.playtika?'<span class="pill pt">Playtika</span>':''}${focusKeys.has(r.gk)?'<span class="pill fc">focus</span>':''}</td><td>${r.g.publisher?esc(pubName(r.g.publisher)):'<span style="color:#999">unattributed</span>'}</td><td>${esc(r.g.genre)}</td>${D.sites.map(s=>cell(r.per[s])).join('')}<td class="num">${fmt(r.best)}</td><td class="num">${r.walls}</td></tr>`).join('')+'</tbody>';
  put('#catTbl','innerHTML',html);
}

// ---------- history search (spec §4.6)
function renderHist(){
  const q=(document.getElementById('hq').value||'').trim().toLowerCase(); const out=document.getElementById('histOut');
  if(q.length<2){ out.innerHTML='<div class="sub">Type at least two characters. Covers every title ever seen, attributed or not.</div>'; return; }
  const hist={}; for(const s of D.sites) for(const [d,day] of Object.entries(D.presence[s])) for(const [gk,r] of Object.entries(day)) ((hist[gk] ||= {})[s] ||= {})[d]=r[0];
  const res=[]; for(const [gk,g] of Object.entries(D.games)){ const n=g.name.toLowerCase(), p=(g.publisher||'').toLowerCase(); if(!n.includes(q)&&!p.includes(q)) continue; const rank=n===q?0:p===q?1:2; const cnt=Object.values(hist[gk]||{}).reduce((a,x)=>a+Object.keys(x).length,0); res.push({gk,g,rank,cnt}); }
  res.sort((a,b)=>a.rank-b.rank||b.cnt-a.cnt);
  const shown=res.slice(0,25);
  out.innerHTML=shown.map(({gk,g})=>{ const h=hist[gk]||{}; const sites=Object.keys(h); const dates=[...new Set(D.sites.flatMap(s=>D.dates[s]))].sort(); const used=dates.filter(d=>sites.some(s=>h[s]&&h[s][d]!==undefined)); const first=used[0],last=used[used.length-1];
    return `<div class="hcard"><h3>${esc(g.name)} <span class="sub">${g.publisher?esc(pubName(g.publisher)):'<i>publisher not attributed</i>'} · ${sites.length} wall${sites.length===1?'':'s'} · ${first||'—'} → ${last||'—'}</span></h3><table class="hist"><tr><th></th>${dates.map(d=>`<th>${d.slice(5)}</th>`).join('')}</tr>${D.sites.map(s=>`<tr><th style="text-align:left">${D.site_label[s]}</th>${dates.map(d=>{ const cap=D.dates[s].includes(d); if(!cap) return '<td class="nc">·</td>'; const v=h[s]&&h[s][d]; return v===undefined?'<td class="nf">—</td>':`<td>${fmt(v)}</td>`; }).join('')}</tr>`).join('')}</table></div>`; }).join('') + (res.length>25?`<div class="sub">${res.length-25} more match — narrow the search</div>`:'') || '<div class="sub">No matches.</div>';
}

// ---------- panels (spec §4.7, §4.8)
function offersFor(keys,site){ const out=[]; for(const [ok,ref] of Object.entries(D.refs)){ if(site&&ref.site!==site) continue; const day=D.presence[ref.site][D.latest[ref.site]]; for(const k of keys){ const r=day&&day[k]; if(r&&r[2].some(v=>v[0]===ok)) { out.push({ok,ref,gk:k}); break; } } } return out.sort((a,b)=>b.ref.usd-a.ref.usd); }
function ladderTable(ok){ const L=D.ladders[ok]||[]; const total=L.reduce((a,m)=>a+m[3],0); let cum=0; const paid=L.filter(m=>m[3]>0).length; const play=L.filter(m=>m[2]!=='spend').reduce((a,m)=>a+m[3],0);
  const rows=L.map(m=>{ cum+=m[3]; const pct=total?cum/total*100:0; return `<tr class="${m[2]}"><td class="num">${m[0]}</td><td>${esc(m[1])}</td><td><span class="tag ${m[2]}">${m[2]}</span></td><td class="num">${m[3]?fmt(m[3]):'—'}</td><td><span class="bar" style="width:${Math.round(pct*0.8)}px"></span>${fmt(cum)} <span class="sub">${pct.toFixed(0)}%</span></td><td class="num">${m[4]??'—'}</td></tr>`; }).join('');
  return {chips:`<div class="chips"><span class="chip">total ${fmt(total)}</span><span class="chip">steps ${L.length} (${paid} paid)</span><span class="chip">reachable by playing ${fmt(play)} (${total?Math.round(play/total*100):0}%)</span></div>`,
    table:`<table><thead><tr><th class="num">Step</th><th>Milestone</th><th>Type</th><th class="num">Pays</th><th>Cumulative</th><th class="num">Limit</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="sub">milestones not captured</td></tr>'}</tbody></table>`}; }
function openWall(site,keys){ const offers=offersFor(keys,site); const dlg=document.getElementById('panel');
  put('#panelTitle','textContent',`${D.site_label[site]} — ${offers[0]?offers[0].ref.name:(D.games[keys[0]]?.name||'')}`);
  put('#panelBody','innerHTML', offers.length? offers.map(o=>{ const t=ladderTable(o.ok); return `<h4 style="margin:6px 0 2px">${esc(o.ref.name)} <span class="sub">${esc(o.ref.plat)}</span></h4>${t.chips}${t.table}`; }).join('<hr style="border:0;border-top:1px solid #dfe3e8;margin:14px 0">') : '<div class="sub">Not listed on this wall in the latest capture — there is history, but no ladder to open.</div>');
  dlg.showModal(); }
function openCompare(keys){ const offers=offersFor(keys); if(offers.length<=1){ if(offers.length) openWall(offers[0].ref.site,keys); else openWall(D.sites[0],keys); return; }
  const lads=offers.map(o=>D.ladders[o.ok]||[]); const n=Math.max(...lads.map(l=>l.length));
  let rows=''; for(let i=0;i<n;i++){ const vals=lads.map(l=>l[i]?l[i][3]:null); const max=Math.max(...vals.map(v=>v??-1)); rows+=`<tr><td class="num">${i+1}</td>${lads.map((l,j)=>{ const m=l[i]; if(!m) return '<td style="color:#bbb">—</td>'; return `<td class="${m[3]===max&&max>0?'best':''}"><b>${m[3]?fmt(m[3]):'—'}</b> <span class="sub">${esc(m[1])}</span></td>`; }).join('')}</tr>`; }
  rows+=`<tr><td></td>${lads.map(l=>`<td><b>Sum of steps ${fmt(l.reduce((a,m)=>a+m[3],0))}</b></td>`).join('')}</tr>`;
  put('#panelTitle','textContent',`${D.games[keys[0]]?.name||''} — walls side by side`);
  put('#panelBody','innerHTML',`<table><thead><tr><th class="num">#</th>${offers.map(o=>`<th>${D.site_label[o.ref.site]} <span class="sub">${esc(o.ref.plat)} · ${fmt(o.ref.usd)}</span></th>`).join('')}</tr></thead><tbody>${rows}</tbody></table><div class="caveat">Rows are aligned by position in each ladder, not by the step number a wall reports (Freecash numbers from 0 and skips; KashKick from 1). The sum of steps can slightly exceed the headline reward on Freecash, which lists a separate IAP cap beside the ladder.</div>`);
  document.getElementById('panel').showModal(); }
document.addEventListener('click',e=>{ const st=e.target.closest('td.st[data-wall]'); if(st){ openWall(st.dataset.wall, st.dataset.keys.split('||').filter(Boolean)); return; } const g=e.target.closest('.gname'); if(g) openCompare(g.dataset.keys.split('||').filter(Boolean)); });

// ---------- KPIs (spec §4.2)
function renderKpis(){
  const cards=D.sites.map(s=>{ const ds=D.dates[s]; const d=ds[ds.length-1], p=ds[ds.length-2]; const n=D.date_runs[s][d].games, pn=p?D.date_runs[s][p].games:null; const dl=pn==null?'':`<span style="color:${n-pn>=0?C().up:C().down}">${n-pn>=0?'+':'−'}${Math.abs(n-pn)}</span> vs previous capture`;
    const caps=D.date_runs[s][d].captures||1;
    return `<div class="kpi"><div class="l">${D.site_label[s]} · ${d}</div><div class="v">${n}</div><div class="d">offers ${dl}${caps>1?` · ${caps} captures merged`:''}</div></div>`; }).join('');
  const listed=D.block1.filter(b=>D.sites.some(s=>pres(s,D.latest[s],b.keys))).length;
  put('#kpis','innerHTML',cards+`<div class="kpi"><div class="l">Focus games listed</div><div class="v" id="kFocus">${listed}/${D.block1.length}</div><div class="d">on at least one wall</div></div><div class="kpi"><div class="l">Competitor extras</div><div class="v">${D.block2.length}</div><div class="d">not on the focus list</div></div>`);
}

// ---------- email (spec §5)
async function copyHtml(el,html){
  try{ if(navigator.clipboard&&window.ClipboardItem&&window.isSecureContext){ await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([emailText(html)],{type:'text/plain'})})]); return true; } }catch(e){}
  try{ const r=document.createRange(); r.selectNodeContents(el); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); const ok=document.execCommand('copy'); sel.removeAllRanges(); return ok; }catch(e){ return false; }
}
function openEmail(){ const {subject,html}=buildEmail(); put('#subjLine','textContent','Subject: '+subject); put('#emailBody','innerHTML',html); document.getElementById('copySubj').onclick=async()=>{ try{ await navigator.clipboard.writeText(subject); }catch(e){ const t=document.createElement('textarea'); t.value=subject; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); } toast('Subject copied'); };
  document.getElementById('copyBody').onclick=async()=>{ const ok=await copyHtml(document.getElementById('emailBody'),html); toast(ok?'Email copied — paste into Outlook with Ctrl+V':'Copy failed — select the preview and copy manually'); };
  document.getElementById('dlg').showModal(); }

// ---------- wiring
function renderAll(){ const {date,clamped}=chosenDate(); put('#baselineNote','textContent',`vs ${date}${clamped?' · earliest we hold':''}`); renderKpis(); renderFocus(); renderPub(); }
function init(){
  audit(['tabs','win','baselineNote','q','fs','fw','btnEmail','kpis','p-focus','legend','focusTbl','p-pub','pubTbl','pubCaveat','p-cat','catTbl','p-hist','hq','histOut','panel','panelTitle','panelBody','dlg','subjLine','emailBody','copySubj','copyBody','toast','checkChip']);
  document.title=`Offerwall competitive status — ${longDate(D.check_date)}`; put('#checkChip','textContent',`check ${longDate(D.check_date)}`);
  const fw=document.getElementById('fw'); D.sites.forEach(s=>fw.insertAdjacentHTML('beforeend',`<option value="${s}">${D.site_label[s]}</option>`));
  document.getElementById('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{ b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.t)); });
  document.getElementById('win').onchange=e=>{ S.win=e.target.value; renderAll(); };
  document.getElementById('q').oninput=e=>{ S.q=e.target.value.trim(); renderFocus(); renderPub(); };
  document.getElementById('fs').onchange=e=>{ S.fs=e.target.value; renderFocus(); };
  fw.onchange=e=>{ S.fw=e.target.value; renderFocus(); };
  document.getElementById('hq').oninput=renderHist;
  document.getElementById('btnEmail').onclick=openEmail;
  renderAll(); renderCatalog(); renderHist();
  // deep links (used by the email): ?tab=pub|cat|hist|focus  ?win=7  ?q=text  ?game=<key>  ?wall=<site>&game=<key>
  const P=new URLSearchParams(location.search);
  if(P.get('win')&&['1','7','30','365'].includes(P.get('win'))){ S.win=P.get('win'); document.getElementById('win').value=S.win; renderAll(); }
  if(P.get('q')){ S.q=P.get('q'); document.getElementById('q').value=S.q; renderFocus(); }
  if(P.get('tab')){ const b=document.querySelector(`#tabs button[data-t="${P.get('tab')}"]`); if(b) b.click(); }
  if(P.get('game')){ const gk=P.get('game'); if(D.games[gk]){ if(P.get('wall')&&D.sites.includes(P.get('wall'))) openWall(P.get('wall'),[gk]); else openCompare([gk]); } }
}
